# Mirror the single deploy set from Development onto main:
#   docker-compose.yml
#   .env.example
#   README.md
#   nexusops
#
# Application source and image builds stay on Development.

name: Sync deploy files to main

on:
  push:
    branches: [Development]
    paths:
      - docker-compose.yml
      - README.md
      - .env.example
      - nexusops
      - .github/workflows/sync-deploy-files.yml
  workflow_dispatch:

concurrency:
  group: sync-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Copy deploy files to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dest

      - name: Copy files and push
        working-directory: dest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=(docker-compose.yml .env.example README.md nexusops)
          for f in "${files[@]}"; do
            test -f "../source/${f}"
            cp "../source/${f}" "./${f}"
          done
          chmod +x ./nexusops

          # Only docker-compose.yml is the compose file.
          rm -f ./docker-compose.server.yml ./.env.server.example

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git rm -f --ignore-unmatch docker-compose.server.yml .env.server.example

          if git diff --cached --quiet; then
            echo "main already has the current deploy files."
            exit 0
          fi

          git commit -m "Sync deploy files from Development (${SOURCE_SHA:0:7})

          Publishes docker-compose.yml, .env.example, README.md, and nexusops.
          [skip ci]"
          git push origin HEAD:main
