# Mirror deploy files from Development onto main so a server can
# `git clone -b main` / `git pull` and run `docker compose` with no -f.
#
# On main these become:
#   docker-compose.yml   (from docker-compose.server.yml)
#   .env.example         (from .env.server.example)
#   README.md
#   nexusops
#
# Application source and image builds stay on Development.

name: Sync deploy files to main

on:
  push:
    branches: [Development]
    paths:
      - docker-compose.server.yml
      - README.md
      - .env.server.example
      - nexusops
      - .github/workflows/sync-deploy-files.yml
  workflow_dispatch:

concurrency:
  group: sync-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Copy deploy files to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dest

      - name: Copy files and push
        working-directory: dest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -f ../source/docker-compose.server.yml
          test -f ../source/README.md
          test -f ../source/.env.server.example
          test -f ../source/nexusops

          cp ../source/docker-compose.server.yml ./docker-compose.yml
          cp ../source/.env.server.example ./.env.example
          cp ../source/README.md ./README.md
          cp ../source/nexusops ./nexusops
          chmod +x ./nexusops

          # Drop the old names so `docker compose up` is unambiguous.
          rm -f ./docker-compose.server.yml ./.env.server.example

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml .env.example README.md nexusops
          git rm -f --ignore-unmatch docker-compose.server.yml .env.server.example

          if git diff --cached --quiet; then
            echo "main already has the current deploy files."
            exit 0
          fi

          git commit -m "Sync deploy files from Development (${SOURCE_SHA:0:7})

          Publishes docker-compose.yml, .env.example, README.md, and nexusops.
          [skip ci]"
          git push origin HEAD:main
