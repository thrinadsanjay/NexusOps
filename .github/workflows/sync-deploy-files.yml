# Copy the deploy files from Development to main on every Development push.
# Does not wait for tests or image builds. No path filters (merge commits
# sometimes skip path filters and left main stale).
#
#   docker-compose.yml
#   .env.example
#   README.md
#   nexusops

name: Sync deploy files to main

on:
  push:
    branches: [Development]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: sync-deploy-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Copy deploy files to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dest
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Copy files and push to main
        working-directory: dest
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(docker-compose.yml .env.example README.md nexusops)
          for f in "${files[@]}"; do
            if [ ! -f "../source/${f}" ]; then
              echo "Missing on Development: ${f}"
              exit 1
            fi
            cp "../source/${f}" "./${f}"
          done
          chmod +x ./nexusops
          rm -f ./docker-compose.server.yml ./.env.server.example

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git rm -f --ignore-unmatch docker-compose.server.yml .env.server.example

          if git diff --cached --quiet; then
            echo "main already matches Development deploy files."
            echo "main already in sync with ${SOURCE_SHA:0:7}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "Sync deploy files from Development (${SOURCE_SHA:0:7})

          Publishes docker-compose.yml, .env.example, README.md, and nexusops.
          [skip ci]"

          git push origin HEAD:main
          echo "Pushed deploy files to main from ${SOURCE_SHA:0:7}." >> "$GITHUB_STEP_SUMMARY"
          echo "Synced to main from \`${SOURCE_SHA:0:7}\`."
