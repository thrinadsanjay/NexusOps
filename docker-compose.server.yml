# Image-only stack for a new server (no source tree, no image builds).
# On main this file is published as docker-compose.yml so you can:
#   cp .env.example .env && ./nexusops install
#   docker compose up -d
#
# Browser URLs must use the host's DNS name or IP, not Docker service names.

name: nexusops

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-nexusops}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_BASE_URL: ${APP_BASE_URL:-http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}}
  FRONTEND_URL: ${FRONTEND_URL:-http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-5173}}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-nexusops}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-nexusops}}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nexusops}
  POSTGRES_USER: ${POSTGRES_USER:-nexusops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@nexusops.local}
  DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-ChangeMe123!}
  SCAN_NETWORKS: ${SCAN_NETWORKS:-}
  LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
  LDAP_DOMAIN: ${LDAP_DOMAIN:-homelab.local}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=homelab,dc=local}
  PYTHONPATH: /app

services:
  postgres:
    # Debian, not Alpine: recent postgres:*-alpine tags need a newer libseccomp
    # than many RHEL/lab Docker hosts provide (initdb then fails with EPERM on
    # postmaster.pid / pg_wal). seccomp=unconfined is a fallback for old engines.
    image: ${NEXUSOPS_POSTGRES_IMAGE:-postgres:16}
    container_name: nexusops-postgres
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${NEXUSOPS_BACKEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-backend:latest}
    container_name: nexusops-backend
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      <<: *backend-environment
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    image: ${NEXUSOPS_BACKEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-backend:latest}
    container_name: nexusops-worker
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    image: ${NEXUSOPS_FRONTEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-frontend:latest}
    container_name: nexusops-frontend
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}}
    depends_on:
      backend:
        condition: service_healthy

  openldap:
    image: osixia/openldap:1.5.0
    container_name: nexusops-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-NexusOps Homelab}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-homelab.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=homelab,dc=local}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_READONLY_USER: ${LDAP_READONLY_USER:-true}
      LDAP_READONLY_USER_USERNAME: ${LDAP_READONLY_USER_USERNAME:-readonly}
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_USER_PASSWORD:-readonly}
      LDAP_TLS: "false"
    ports:
      - "${LDAP_BIND:-127.0.0.1}:${LDAP_PORT:-389}:389"
    volumes:
      - ldap_data:/var/lib/ldap:Z
      - ldap_config:/etc/ldap/slapd.d:Z
    command: "--loglevel warning"

volumes:
  postgres_data:
  redis_data:
  ldap_data:
  ldap_config:
