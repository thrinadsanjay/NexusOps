# NexusOps — single compose file for local and server.
#   cp .env.example .env
#   ./nexusops install          # server (clone of main)
#   docker compose up -d        # pull published images
#   docker compose up -d --build  # build from source (Development only)
#
# Browser URLs must use the host DNS name or IP, not Docker service names.

name: nexusops

# Proxmox VE / unprivileged LXC: AppArmor and seccomp otherwise deny
# eventfd/epoll (uvloop) and overlay writes. Applied to API, worker, UI.
x-pve-compat: &pve-compat
  security_opt:
    - seccomp:unconfined
    - apparmor:unconfined
  shm_size: 64mb

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-nexusops}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_BASE_URL: ${APP_BASE_URL:-http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}}
  FRONTEND_URL: ${FRONTEND_URL:-http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-5173}}
  # Always the compose DNS name, not host DATABASE_URL (often sqlite or localhost).
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nexusops}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-nexusops}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nexusops}
  POSTGRES_USER: ${POSTGRES_USER:-nexusops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@nexusops.local}
  DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-ChangeMe123!}
  SCAN_NETWORKS: ${SCAN_NETWORKS:-}
  LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
  LDAP_DOMAIN: ${LDAP_DOMAIN:-homelab.local}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=homelab,dc=local}
  PYTHONPATH: /app
  # Import-time DB init races uvicorn's already-running loop (uvloop teardown).
  NEXUSOPS_SKIP_IMPORT_BOOTSTRAP: "1"

services:
  postgres:
    # Debian image: Alpine tags need a newer libseccomp than many lab hosts.
    # tmpfs + AppArmor/seccomp opts: Proxmox/Debian often cannot write the
    # Unix socket under /var/run/postgresql (Permission denied after initdb).
    image: ${NEXUSOPS_POSTGRES_IMAGE:-postgres:16}
    container_name: nexusops-postgres
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=01777
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - unix_socket_directories=/var/run/postgresql,/tmp
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *pve-compat
    image: ${NEXUSOPS_BACKEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    container_name: nexusops-backend
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      <<: *backend-environment
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    tmpfs:
      - /tmp:mode=01777
    cap_add:
      # ICMP ping for subnet scan. NET_ADMIN is omitted: on Proxmox LXC it
      # often yields PermissionError at process start without helping ping.
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --loop asyncio: uvloop on Proxmox/LXC raises PermissionError, then
    # "Cannot close a running event loop" while uvicorn tears down.
    command: sh -c "PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000 --loop asyncio --http h11"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    <<: *pve-compat
    image: ${NEXUSOPS_BACKEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    container_name: nexusops-worker
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      <<: *backend-environment
    tmpfs:
      - /tmp:mode=01777
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    <<: *pve-compat
    image: ${NEXUSOPS_FRONTEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: nexusops-frontend
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  openldap:
    # osixia/openldap uses bash -e; `hostname --fqdn` exiting 1 (no FQDN) aborts
    # slapd startup. Restart then hits File exists on leftover /container/run links.
    <<: *pve-compat
    image: osixia/openldap:1.5.0
    container_name: nexusops-ldap
    hostname: ldap.${LDAP_DOMAIN:-homelab.local}
    domainname: ${LDAP_DOMAIN:-homelab.local}
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-NexusOps Homelab}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-homelab.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=homelab,dc=local}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_READONLY_USER: ${LDAP_READONLY_USER:-true}
      LDAP_READONLY_USER_USERNAME: ${LDAP_READONLY_USER_USERNAME:-readonly}
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_USER_PASSWORD:-readonly}
      LDAP_TLS: "false"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_NOFILE: "1024"
    tmpfs:
      - /container/run
      - /tmp
      - /var/run/slapd
    ports:
      - "${LDAP_BIND:-127.0.0.1}:${LDAP_PORT:-389}:389"
    volumes:
      - ldap_data:/var/lib/ldap:Z
      - ldap_config:/etc/ldap/slapd.d:Z
    command: ["--copy-service", "--loglevel", "info"]
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -b ${LDAP_BASE_DN:-dc=homelab,dc=local} -s base >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  ldap_data:
  ldap_config:
