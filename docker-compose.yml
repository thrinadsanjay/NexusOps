# App images default to GHCR tags published by .github/workflows/docker-publish.yml.
# Override with NEXUSOPS_BACKEND_IMAGE / NEXUSOPS_FRONTEND_IMAGE, or build locally:
#   docker compose up --build
services:
  postgres:
    image: ${NEXUSOPS_POSTGRES_IMAGE:-postgres:16}
    container_name: nexusops-postgres
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=01777
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - unix_socket_directories=/var/run/postgresql,/tmp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${NEXUSOPS_BACKEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    container_name: nexusops-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexusops:change-me@postgres:5432/nexusops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCAN_NETWORKS: ${SCAN_NETWORKS:-}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-homelab.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=homelab,dc=local}
      PYTHONPATH: /app
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    image: ${NEXUSOPS_BACKEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    container_name: nexusops-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexusops:change-me@postgres:5432/nexusops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    image: ${NEXUSOPS_FRONTEND_IMAGE:-ghcr.io/thrinadsanjay/nexusops-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

  openldap:
    image: osixia/openldap:1.5.0
    container_name: nexusops-ldap
    environment:
      LDAP_ORGANISATION: "NexusOps Homelab"
      LDAP_DOMAIN: homelab.local
      LDAP_BASE_DN: dc=homelab,dc=local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: readonly
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    command: "--loglevel warning"

volumes:
  postgres_data:
  redis_data:
  ldap_data:
  ldap_config:
