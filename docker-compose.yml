services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusops-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexusops:change-me@postgres:5432/nexusops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCAN_NETWORKS: ${SCAN_NETWORKS:-}
      PYTHONPATH: /app
      PIP_INDEX_URL: https://artifactory.colruyt.int/artifactory/api/pypi/pypi-remote/simple
      PIP_TRUSTED_HOST: artifactory.colruyt.int
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusops-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexusops:change-me@postgres:5432/nexusops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      PIP_INDEX_URL: https://artifactory.colruyt.int/artifactory/api/pypi/pypi-remote/simple
      PIP_TRUSTED_HOST: artifactory.colruyt.int
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
  redis_data:
