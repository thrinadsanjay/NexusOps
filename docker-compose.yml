services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusops-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexusops:change-me@postgres:5432/nexusops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCAN_NETWORKS: ${SCAN_NETWORKS:-}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-homelab.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=homelab,dc=local}
      PYTHONPATH: /app
      PIP_INDEX_URL: https://artifactory.colruyt.int/artifactory/api/pypi/pypi-remote/simple
      PIP_TRUSTED_HOST: artifactory.colruyt.int
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusops-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexusops:change-me@postgres:5432/nexusops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      PIP_INDEX_URL: https://artifactory.colruyt.int/artifactory/api/pypi/pypi-remote/simple
      PIP_TRUSTED_HOST: artifactory.colruyt.int
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

  openldap:
    image: osixia/openldap:1.5.0
    container_name: nexusops-ldap
    environment:
      LDAP_ORGANISATION: "NexusOps Homelab"
      LDAP_DOMAIN: homelab.local
      LDAP_BASE_DN: dc=homelab,dc=local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD:-NexusOps2024!}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: readonly
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    command: "--loglevel warning"

  ldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: nexusops-ldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8082:80"
    depends_on:
      - openldap

volumes:
  postgres_data:
  redis_data:
  ldap_data:
  ldap_config:
