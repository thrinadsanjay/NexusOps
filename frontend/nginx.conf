server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # Same-origin API when VITE_API_BASE_URL is empty or localhost.
    # Docker DNS: re-resolve backend if the container IP changes.
    location /.well-known/acme-challenge/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $nexusops_backend backend:8000;
        proxy_pass http://$nexusops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $nexusops_backend backend:8000;
        proxy_pass http://$nexusops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
